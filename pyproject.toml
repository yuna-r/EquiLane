[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "equilane"
version = "0.1.0"
description = "EquiLane — Intrinsics Equivalence Testing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "EquiLane contributors"}]
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
equilane = "equilane.cli:main"
ioitf = "equilane.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
equilane = ["assets/*.png", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
