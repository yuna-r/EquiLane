name: Publish verified report snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish the verified local report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the recorded report and publishing tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the earlier canonical report
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: saved-report
          persist-credentials: false
      - name: Verify archives and stage the readable reports
        run: >-
          python3 tools/export_execution_snapshot.py
          --verify reports/extended-1895 --site _site --legacy-site saved-report
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public report snapshot
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy verified snapshot
        id: deployment
        uses: actions/deploy-pages@v4
